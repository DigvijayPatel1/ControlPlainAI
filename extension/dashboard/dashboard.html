<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ControlPlane AI</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <main>
        <header>
            <div><small>CONTROLPLANE / LIVE</small>
                <h1>Security centre</h1>
            </div><span id="connection">Offline</span>
        </header>
        <section class="metrics">
            <article><small>Requests</small><strong id="requests">0</strong></article>
            <article><small>Blocked</small><strong id="blocked">0</strong></article>
            <article><small>Reviews</small><strong id="reviews">0</strong></article>
            <article><small>Cost</small><strong id="cost">$0.0000</strong></article>
        </section>
        <section>
            <h2>Recent requests</h2>
            <div id="table">Add an API key in the extension popup.</div>
        </section>
        <section>
            <h2>Pending review</h2>
            <div id="review">No reviews loaded.</div>
        </section>
    </main>
    <script src="dashboard.js"></script>
</body>

</html>
